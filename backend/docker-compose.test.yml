name: cablan-backend-test

services:
  app:
    env_file:
      - .env.test

  # The test database is disposable: every scenario truncates and reseeds it, so it
  # lives in memory with durability off. A restart empties it; migrations re-apply on start.
  db:
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
