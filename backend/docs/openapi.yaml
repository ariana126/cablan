info:
  title: API
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Role:
      type: string
      enum:
        - system_admin
        - management
        - qc_inspector
        - reporter
    RegisterUserDto:
      type: object
      properties:
        name:
          type: string
          example: Sina Ghadrdan
        username:
          type: string
          example: sina.q
        password:
          type: string
          example: Passw0rd!
        role:
          example: qc_inspector
          allOf:
            - $ref: '#/components/schemas/Role'
      required:
        - name
        - username
        - password
        - role
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: Sina Ghadrdan
        username:
          type: string
          example: sina.q
        password:
          type: string
          example: NewPassw0rd!
        role:
          example: management
          allOf:
            - $ref: '#/components/schemas/Role'
    LoginUserDto:
      type: object
      properties:
        username:
          type: string
          example: sina.q
        password:
          type: string
          example: Passw0rd!
      required:
        - username
        - password
    RegisterMaterialDto:
      type: object
      properties:
        name:
          type: string
          example: Steel Rod
      required:
        - name
    UpdateMaterialDto:
      type: object
      properties:
        name:
          type: string
          example: Steel Rod
      required:
        - name
    RegisterComponentDto:
      type: object
      properties:
        name:
          type: string
          example: Bolt
      required:
        - name
    UpdateComponentDto:
      type: object
      properties:
        name:
          type: string
          example: Bolt
      required:
        - name
    RegisterProductMaterialDto:
      type: object
      properties:
        name:
          type: string
          example: Steel Rod
      required:
        - name
    RegisterProductComponentDto:
      type: object
      properties:
        name:
          type: string
          example: Bolt
        materials:
          type: array
          items:
            $ref: '#/components/schemas/RegisterProductMaterialDto'
      required:
        - name
        - materials
    RegisterProductDto:
      type: object
      properties:
        name:
          type: string
          example: Widget
        components:
