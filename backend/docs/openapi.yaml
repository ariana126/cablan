        password:
          type: string
          example: Passw0rd!
        role:
          example: qc_inspector
          allOf:
            - $ref: '#/components/schemas/Role'
      required:
        - name
        - username
        - password
        - role
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          example: Sina Ghadrdan
        username:
          type: string
          example: sina.q
        password:
          type: string
          example: NewPassw0rd!
        role:
          example: management
          allOf:
            - $ref: '#/components/schemas/Role'
    LoginUserDto:
      type: object
      properties:
        username:
          type: string
          example: sina.q
        password:
          type: string
          example: Passw0rd!
