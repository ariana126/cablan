name: Publish living documentation

# Runs on every new change to main — whether merged via PR or pushed directly.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '**/.claude/**'
  workflow_dispatch:

# Serialise publishes; a newer push to main supersedes an in-flight one.
concurrency:
  group: living-documentation
  cancel-in-progress: true

jobs:
  publish:
    name: Render and publish living documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Same two-step shape as ci.yml's acceptance-tests job: run the suite, then
      # aggregate what it recorded into the browsable HTML site. render is best-effort
      # so a flaky run still publishes whatever was captured.
      - run: make run-acceptance-tests
      - name: Render living documentation
        if: always()
        run: make render-living-documentation

      # Pushed over SSH to the team server, where nginx serves it behind Authelia.
      # The key is forced to `rrsync -wo` into one directory there, so it can do nothing
      # else: no shell, no reads, no writes outside it. --delay-updates moves every file
      # into place at the end, so a reader almost never sees a half-updated site.
      - name: Publish to the team server
        if: always() && hashFiles('acceptance-tests/target/site/serenity/index.html') != ''
        env:
          SSH_KEY: ${{ secrets.LIVING_DOC_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LIVING_DOC_KNOWN_HOSTS }}
          TARGET: ${{ vars.LIVING_DOC_USER }}@${{ vars.LIVING_DOC_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlt --delete --delay-updates --chmod=D755,F644 \
            -e 'ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=yes' \
            acceptance-tests/target/site/serenity/ "$TARGET:/"
