name: Deploy

# Runs only once CI has passed on main — see ci.yml for the nine checks that gate every push.
# `workflow_dispatch` is the manual escape hatch: re-run a deploy with no new commit, e.g. after
# a Hamravesh-side hiccup.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A deploy in flight should finish, never be cut off by the next push — unlike ci.yml's own
# group, this one does not cancel-in-progress.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Reuses the same target a developer runs locally (see backend/Makefile) rather than
      # re-implementing the build in the workflow — the Makefile stays the one place that knows
      # how to build this image.
      - name: Build the production image
        run: make backend/build-prod

      # Hamravesh's Darkube deploy step (below, in the backend job) resolves an app's image by
      # tag from the registry that app was created against — not from an arbitrary external
      # registry — so this has to be Hamravesh's own registry, not GHCR.
      - name: Tag and push to the Hamravesh registry
        env:
          REGISTRY: ${{ vars.HAMRAVESH_REGISTRY }}
          REGISTRY_USER: ${{ vars.HAMRAVESH_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.HAMRAVESH_REGISTRY_PASSWORD }}
          IMAGE: ${{ vars.HAMRAVESH_REGISTRY }}/${{ vars.DARKUBE_BACKEND_APP_NAME }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"
          SHORT_SHA="${SHA:0:7}"
          docker tag cablan-backend:prod "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:$SHORT_SHA"

  deploy-backend:
    name: Deploy backend
    needs: build-backend
    runs-on: ubuntu-latest
    # Hamravesh's own CLI, distributed as a container image rather than a GitHub Action — pinned
    # by digest for the same reason every third-party action below is pinned by commit SHA (see
    # ../../CLAUDE.md's "Continuous deployment" section for how to check whether v1.1 still
    # resolves to this digest before bumping it).
    container: hamravesh.hamdocker.ir/public/darkube-cli@sha256:9f2dde5429b78b7472b43d7610bc823d619dc9ef6f86f206167767100fd22415 # v1.1
    steps:
      - name: Roll out on Hamravesh
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_BACKEND_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ vars.DARKUBE_BACKEND_APP_ID }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          darkube deploy --ref main --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID" \
            --image-tag "$SHORT_SHA" --job-id "$GITHUB_RUN_ID" --stateless-app true

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build the production image
        run: make frontend/build-prod

      - name: Tag and push to the Hamravesh registry
        env:
          REGISTRY: ${{ vars.HAMRAVESH_REGISTRY }}
          REGISTRY_USER: ${{ vars.HAMRAVESH_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.HAMRAVESH_REGISTRY_PASSWORD }}
          IMAGE: ${{ vars.HAMRAVESH_REGISTRY }}/${{ vars.DARKUBE_FRONTEND_APP_NAME }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"
          SHORT_SHA="${SHA:0:7}"
          docker tag cablan-frontend-prod:latest "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:$SHORT_SHA"

  deploy-frontend:
    name: Deploy frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    container: hamravesh.hamdocker.ir/public/darkube-cli@sha256:9f2dde5429b78b7472b43d7610bc823d619dc9ef6f86f206167767100fd22415 # v1.1
    steps:
      - name: Roll out on Hamravesh
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_FRONTEND_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ vars.DARKUBE_FRONTEND_APP_ID }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          darkube deploy --ref main --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID" \
            --image-tag "$SHORT_SHA" --job-id "$GITHUB_RUN_ID" --stateless-app true
