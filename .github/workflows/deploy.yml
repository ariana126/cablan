name: Deploy

# Ships to production (Hamravesh's Darkube) on a push to the production branch — a promotion,
# `make promote-production`. It never builds: it rolls out the images deploy-staging.yml built and
# ran on staging for this very commit, by their short-SHA tag, and `verify-staging` refuses any
# commit staging never deployed. `workflow_dispatch` on production is the manual re-run (a
# Hamravesh-side hiccup, say).
on:
  push:
    branches: [production]
  workflow_dispatch:

# A deploy in flight should finish, never be cut off by the next promotion — unlike ci.yml's own
# group, this one does not cancel-in-progress.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read # verify-staging reads the commit's `deploy/staging` status

jobs:
  # The gate: production only ever ships a commit that was successfully deployed to staging.
  # deploy-staging.yml sets a `deploy/staging` success status on the commit as its last step —
  # after CI passed on staging, both images were pushed with this tag and the stack came up
  # healthy — so this one check covers all three.
  verify-staging:
    name: Verify the commit was deployed to staging
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/production ]; then
            echo "::error::Production deploys only from the production branch, not $GITHUB_REF"
            exit 1
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --paginate \
            --jq '[.[] | select(.context == "deploy/staging" and .state == "success")] | length' | awk '{n += $1} END {print n + 0}')
          if [ "$count" = 0 ]; then
            echo "::error::$GITHUB_SHA was never deployed to staging — promote it through staging first"
            exit 1
          fi
          echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend
    needs: verify-staging
    runs-on: ubuntu-latest
    # Hamravesh's own CLI, distributed as a container image rather than a GitHub Action — pinned
    # by digest for the same reason every third-party action is pinned by commit SHA (see
    # ../../CLAUDE.md's "Branches and environments" section for how to check whether v1.1 still
    # resolves to this digest before bumping it).
    container: hamravesh.hamdocker.ir/public/darkube-cli@sha256:9f2dde5429b78b7472b43d7610bc823d619dc9ef6f86f206167767100fd22415 # v1.1
    steps:
      - name: Roll out on Hamravesh
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_BACKEND_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ vars.DARKUBE_BACKEND_APP_ID }}
          SHORT_SHA: ${{ needs.verify-staging.outputs.tag }}
        run: |
          darkube deploy --ref production --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID" \
            --image-tag "$SHORT_SHA" --job-id "$GITHUB_RUN_ID" --stateless-app true

  deploy-frontend:
    name: Deploy frontend
    needs: verify-staging
    runs-on: ubuntu-latest
    container: hamravesh.hamdocker.ir/public/darkube-cli@sha256:9f2dde5429b78b7472b43d7610bc823d619dc9ef6f86f206167767100fd22415 # v1.1
    steps:
      - name: Roll out on Hamravesh
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_FRONTEND_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ vars.DARKUBE_FRONTEND_APP_ID }}
          SHORT_SHA: ${{ needs.verify-staging.outputs.tag }}
        run: |
          darkube deploy --ref production --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID" \
            --image-tag "$SHORT_SHA" --job-id "$GITHUB_RUN_ID" --stateless-app true

  # Fallbacks for the two rollouts above. Hamravesh's API has been seen dropping TLS from GitHub's
  # hosted runners while still accepting it from inside Iran, so when a rollout fails these retry
  # the same command on the team server's self-hosted runner (label `hamravesh`). They run only
  # when the gate passed and the hosted rollout failed — never in addition to a success.
  # See ../../CLAUDE.md's "Branches and environments" section for the runner itself.
  deploy-backend-fallback:
    name: Deploy backend (fallback)
    needs: [verify-staging, deploy-backend]
    if: always() && needs.verify-staging.result == 'success' && needs.deploy-backend.result == 'failure'
    runs-on: [self-hosted, hamravesh]
    container: hamravesh.hamdocker.ir/public/darkube-cli@sha256:9f2dde5429b78b7472b43d7610bc823d619dc9ef6f86f206167767100fd22415 # v1.1
    steps:
      - name: Roll out on Hamravesh
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_BACKEND_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ vars.DARKUBE_BACKEND_APP_ID }}
          SHORT_SHA: ${{ needs.verify-staging.outputs.tag }}
        run: |
          darkube deploy --ref production --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID" \
            --image-tag "$SHORT_SHA" --job-id "$GITHUB_RUN_ID" --stateless-app true

  deploy-frontend-fallback:
    name: Deploy frontend (fallback)
    needs: [verify-staging, deploy-frontend]
    if: always() && needs.verify-staging.result == 'success' && needs.deploy-frontend.result == 'failure'
    runs-on: [self-hosted, hamravesh]
    container: hamravesh.hamdocker.ir/public/darkube-cli@sha256:9f2dde5429b78b7472b43d7610bc823d619dc9ef6f86f206167767100fd22415 # v1.1
    steps:
      - name: Roll out on Hamravesh
        env:
          DARKUBE_DEPLOY_TOKEN: ${{ secrets.DARKUBE_FRONTEND_DEPLOY_TOKEN }}
          DARKUBE_APP_ID: ${{ vars.DARKUBE_FRONTEND_APP_ID }}
          SHORT_SHA: ${{ needs.verify-staging.outputs.tag }}
        run: |
          darkube deploy --ref production --token "$DARKUBE_DEPLOY_TOKEN" --app-id "$DARKUBE_APP_ID" \
            --image-tag "$SHORT_SHA" --job-id "$GITHUB_RUN_ID" --stateless-app true
